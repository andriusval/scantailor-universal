[project]
name = "st-mcp"
version = "0.1.0"
description = "MCP server + CLI that lets agents drive ScanTailor Universal"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["mcp>=2.3,<3", "pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
series = ["scipy>=1.11"]

[project.scripts]
st-mcp = "st_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["st_mcp"]
