name: windows portable build (Qt6)

# Builds GUI + CLI on Windows and uploads a portable zip
# (exe files + Qt runtime via windeployqt + vcpkg DLLs).
# Based on windows-Qt6.yml.

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - 'agentic/**'
    # Only when something that goes into the build changes (C++ sources, CMake,
    # Windows packaging, this workflow) - not for docs or tools/st-mcp (Python).
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'config.h.in'
      - 'version.h'
      - 'packaging/windows/**'
      - '.github/workflows/windows-portable.yml'

jobs:

  windows-portable:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-bincache
    steps:
      - name: Prepare vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
        shell: powershell
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('.github/workflows/windows-portable.yml', '.build/st-vcpkg-triplets/**') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          install-deps: 'true'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build deps
        env:
          VCPKG_BUILD_TYPE: Release
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg install zlib tiff libpng openjpeg libjpeg-turbo exiv2 opengl pkgconf libmupdf mujs harfbuzz[freetype] gumbo freetype jbig2dec --overlay-triplets "${{ github.workspace }}\.build\st-vcpkg-triplets" --triplet x64-windows-dynamic-boost-static
      - name: Install boost
        env:
          VCPKG_BUILD_TYPE: Release
        run: |
          C:\vcpkg\vcpkg install boost-core boost-foreach boost-bind boost-multi-index boost-mpl boost-test boost-iterator boost-intrusive boost-random boost-range boost-type-traits --overlay-triplets "${{ github.workspace }}\.build\st-vcpkg-triplets" --triplet x64-windows-dynamic-boost-static
      - name: List vcpkg DLLs (diagnostics)
        shell: powershell
        run: |
          Get-ChildItem "C:\vcpkg\installed\x64-windows-dynamic-boost-static\bin" -Filter *.dll | Select-Object -ExpandProperty Name
          Get-ChildItem "C:\vcpkg\installed\x64-windows-dynamic-boost-static\lib" -Filter z*.lib | Select-Object -ExpandProperty Name
      - name: build project
        env:
          QT_VER: 'Qt6'
          CMAKE_BUILD_TYPE: Release
          CMAKE_BUILD_PARALLEL_LEVEL: 8
          QT_ROOT_DIR: '${{ github.workspace }}\Qt\6.12.1\msvc2022_64\'
          CMAKE_PREFIX_PATH: '${{ github.workspace }}\Qt\6.12.1\msvc2022_64\'
          CMAKE_TOOLCHAIN_FILE: 'C:\vcpkg\scripts\buildsystems\vcpkg.cmake'
          VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}\.build\st-vcpkg-triplets'
          VCPKG_TARGET_TRIPLET: 'x64-windows-dynamic-boost-static'
        run: |
          .build\build.ps1 -DPath "C:\vcpkg\installed\${{ env.VCPKG_TARGET_TRIPLET }}" -ReleaseType "${{ env.CMAKE_BUILD_TYPE }}" -DCMAKE_CXX_STANDARD=11 -DENABLE_TESTS=on -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF -DQtPkgList="${{ env.QT_VER }}" -DVCPKG_TARGET_TRIPLET="${{ env.VCPKG_TARGET_TRIPLET }}"
        shell: powershell
      - name: Run autotests
        # 'offscreen' has no fonts on Windows, so TestSkewFinder (which draws text) sees an empty
        # image; the runner has a desktop session, so use the real platform plugin.
        # Failures are reported but do not block the portable bundle.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: 'windows'
          CMAKE_BUILD_TYPE: Release
        run: .build\test.ps1 -ReleaseType "${{ env.CMAKE_BUILD_TYPE }}"
        shell: powershell
      - name: Collect portable bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "${{ github.workspace }}\dist\scantailor-universal"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exes = Get-ChildItem -Path build -Recurse -Filter *.exe |
                  Where-Object { $_.FullName -notmatch '\\(tests?|CMakeFiles)\\' -and $_.Name -notmatch '^(test|.*_tests?)' }
          if (-not $exes) { throw "No executables found in build tree" }
          $exes | ForEach-Object { Write-Host "exe: $($_.FullName)"; Copy-Item $_.FullName $out }
          Copy-Item "C:\vcpkg\installed\x64-windows-dynamic-boost-static\bin\*.dll" $out
          Get-ChildItem -Path build -Recurse -Filter *.dll |
              Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } |
              ForEach-Object { Copy-Item $_.FullName $out -Force }
          Get-ChildItem -Path build -Recurse -Filter *.qm | ForEach-Object { Copy-Item $_.FullName $out -Force }
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"  # set by install-qt-action
          Get-ChildItem $out -Filter *.exe | ForEach-Object {
              & $windeployqt --release --no-compiler-runtime --dir $out $_.FullName
              if ($LastExitCode -ne 0) { throw "windeployqt failed for $($_.Name)" }
          }
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
      - name: Smoke-test CLI
        shell: powershell
        run: |
          $cli = Get-ChildItem "${{ github.workspace }}\dist\scantailor-universal" -Filter *cli*.exe | Select-Object -First 1
          if (-not $cli) { throw "CLI executable not found in bundle" }
          & $cli.FullName --help
          Write-Host "CLI exit code: $LastExitCode"
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-universal-windows-x64-qt6
          path: dist/scantailor-universal
